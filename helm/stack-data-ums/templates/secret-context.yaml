---
{{- /*

Shared secret "templateContext.svcPortalServerUserPassword".

The password value is currently required in two places:

1. In the "templateContext" so that the user can be created with the password.

2. In the created "Secret" for the user "svc-portal-server", so that this
   "Secret" can be used by the chart "portal-server" via the "existingSecret"
   configuration.
*/}}
{{- $isRefSvcPortalServer := include "stack-data-ums.isSecretReference" .Values.templateContext.svcPortalServerUserPassword }}
{{- $passwordSvcPortalServer := "" }}
{{- if not $isRefSvcPortalServer }}
{{- $passwordSvcPortalServer = include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "svc-portal-server" "context" .))
    "key" "password"
    "username" "svc-portal-server"
    "providedValues" (list "templateContext.svcPortalServerUserPassword")
    "context" .
  )
}}
{{- end }}

{{- /*
Initial password for the user "Administrator", "templateContext.initialPasswordAdministrator".

This password is mainly needed in the "templateContext" so that the user
"Administrator" can be created.

The password is also stored within a "Secret" object in Kubernetes, so that
a generated random value can be retrieved after the deployment. Other components
should not use this "Secret" and instead rely on a service user to be created,
like "svc-portal-server" from above.

*/}}
{{- $isRefAdministrator := include "stack-data-ums.isSecretReference" .Values.templateContext.initialPasswordAdministrator }}
{{- $passwordAdministrator := "" }}
{{- if not $isRefAdministrator }}
{{- $passwordAdministrator = include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "administrator" "context" .))
    "key" "password"
    "username" "nubus"
    "site" "nubus-administrator"
    "providedValues" (list "templateContext.initialPasswordAdministrator")
    "context" .
  )
}}
{{- end }}

{{- /*
Shared secret "templateContext.readonlyUserPassword".

The password value is currently required in two places:

1. In the "templateContext" so that the user can be created with the password.

2. In the created "Secret" for the user "readonly", so that this
   "Secret" can be used by the chart "keycloak-bootstrap" via the "existingSecret"
   configuration.

*/}}
{{- $isRefReadonlyUser := include "stack-data-ums.isSecretReference" .Values.templateContext.readonlyUserPassword }}
{{- $passwordReadonlyUser := "" }}
{{- if not $isRefReadonlyUser }}
{{- $passwordReadonlyUser = include "nubus-common.secrets.passwords.manage"
  (dict
    "secret" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "readonly-user" "context" .))
    "key" "password"
    "username" "ldap-server"
    "site" "ldap-readonly"
    "providedValues" (list "templateContext.readonlyUserPassword")
    "context" .
  )
}}
{{- end }}

{{- /* The data-loader reads each password from its per-user Secret, so the value lives in one Secret only. */}}
{{- /* A copy, because other charts of the release read .Values.templateContext as the user set it. */}}
{{- $context := deepCopy .Values.templateContext }}
{{- if not $isRefSvcPortalServer }}
{{- $_ := set $context "svcPortalServerUserPassword" (dict "kubernetesSecret" (dict
  "name" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "svc-portal-server" "context" .)) "key" "password")) }}
{{- end }}
{{- if not $isRefAdministrator }}
{{- $_ := set $context "initialPasswordAdministrator" (dict "kubernetesSecret" (dict
  "name" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "administrator" "context" .)) "key" "password")) }}
{{- end }}
{{- if not $isRefReadonlyUser }}
{{- $_ := set $context "readonlyUserPassword" (dict "kubernetesSecret" (dict
  "name" (include "nubus-common.secrets.name" (dict "defaultNameSuffix" "readonly-user" "context" .)) "key" "password")) }}
{{- end }}

kind: "Secret"
apiVersion: "v1"
metadata:
  name: "{{ include "common.names.fullname" . }}-context"
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  context.yaml: |
    {{- include "common.tplvalues.render" ( dict "value" $context "context" . ) | nindent 4 }}

{{- if not $isRefSvcPortalServer }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "svc-portal-server" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- if (.Values.global.secrets).keep }}
    {{- $_ := set $extraAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  password: {{ $passwordSvcPortalServer | quote }}
{{- end }}
{{- if not $isRefAdministrator }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "administrator" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- if (.Values.global.secrets).keep }}
    {{- $_ := set $extraAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  password: {{ $passwordAdministrator | quote }}

---
{{- /* Moved here from the nubus umbrella chart; name and key stay for the readers documented in nubus-docs and openDesk. */}}
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ printf "%s-nubus-credentials" .Release.Name | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  administrator_password: {{ $passwordAdministrator | quote }}
{{- end }}
{{- if not $isRefReadonlyUser }}
---
kind: "Secret"
apiVersion: "v1"
metadata:
  name: {{ include "nubus-common.secrets.name" (dict "defaultNameSuffix" "readonly-user" "context" .) | quote }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.additionalLabels "context" . ) | nindent 4 }}
  {{- $extraAnnotations := dict }}
  {{- if (.Values.global.secrets).keep }}
    {{- $_ := set $extraAnnotations "helm.sh/resource-policy" "keep" }}
  {{- end }}
  {{- include "nubus-common.annotations.render" ( dict
    "values" ( list $extraAnnotations .Values.additionalAnnotations )
    "context" . )
    | nindent 2 }}
type: Opaque
stringData:
  password: {{ $passwordReadonlyUser | quote }}
{{- end }}
